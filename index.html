<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Barra Adentro</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <div id="world">
      <div id="fog"></div>
      <div id="hud">
        <div id="north"><span>N</span></div>
        <div id="mission"></div>
        <div id="camctl">
          <button data-cam="rl" title="Girar a vista (Q)">⟲</button><button data-cam="rr" title="Girar a vista (E)">⟳</button>
          <button data-cam="zi" title="Aproximar (Z)">+</button><button data-cam="zo" title="Afastar (X)">−</button>
          <button data-cam="center" title="Voltar a centrar no navio (V)" hidden>Centrar</button><button data-cam="chart" title="Carta grande (C)">Carta</button><button data-cam="plan" title="Plano de viagem (O)">Plano</button><button data-cam="horn" title="Apito do navio (B)">Apito</button><button data-cam="sound" title="Ligar ou desligar o som (N)">Som</button><button data-cam="help" title="Ajuda (H)">?</button><button data-cam="layout" title="Trocar entre a tela de celular e a de mesa">Tela</button>
        </div>
        <div id="warpflag" hidden></div>
        <div id="skyflag" hidden></div>
        <div id="planbox" hidden></div>
        <div id="pilothud" hidden></div>
        <div id="log"></div>
      </div>
      <canvas id="bigchart" hidden></canvas>
      <div id="help" hidden></div>
      <div id="plan" hidden></div>
    </div>
    <aside id="bridge"></aside>
  </div>
  <div id="overlay"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
