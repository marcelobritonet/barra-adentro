<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Barra Adentro</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <div id="world">
      <div id="hud">
        <div id="north"><span>N</span></div>
        <div id="mission"></div>
        <div id="camctl">
          <button data-cam="rl" title="Girar a vista (Q)">⟲</button><button data-cam="rr" title="Girar a vista (E)">⟳</button>
          <button data-cam="zi" title="Aproximar (Z)">+</button><button data-cam="zo" title="Afastar (X)">−</button>
          <button data-cam="chart" title="Carta grande (C)">Carta</button><button data-cam="help" title="Ajuda (H)">?</button>
        </div>
        <div id="warpflag" hidden></div>
        <div id="pilothud" hidden></div>
        <div id="log"></div>
      </div>
      <canvas id="bigchart" hidden></canvas>
      <div id="help" hidden></div>
    </div>
    <aside id="bridge"></aside>
  </div>
  <div id="overlay"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
